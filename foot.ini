# Основные настройки терминала
# Используйте вашу командную строку (например, /bin/zsh или /bin/bash)


# Настройки шрифта (размер 11 отлично читается на экранах ThinkPad)
font=Agave Nerd Font:size=11

# Внутренние отступы от краев окна (в пикселях), чтобы текст не прилипал


# Форма курсора (block - монолитный прямоугольник, beam - вертикальная черта, underline)
[cursor]
style=block
blink=yes

# Настройки истории прокрутки (скроллбэк)
[scrollback]
lines=5000

# Цветовая схема (пример минималистичной темной темы Nord/Gruvbox-style)
[colors-dark]
alpha=0.5
background=1c1c1c
foreground=ffffff

# Цвета для ANSI-палитры (обычные и яркие)
regular0=1c1c1c  # black
regular1=ff5c57  # red
regular2=5af78e  # green
regular3=f3f99d  # yellow
regular4=57c7ff  # blue
regular5=ff6ac1  # magenta
regular6=9aedfe  # cyan
regular7=eff0eb  # white

bright0=686868   # bright black
bright1=ff5c57   # bright red
bright2=5af78e   # bright green
bright3=f3f99d   # bright yellow
bright4=57c7ff   # bright blue
bright5=ff6ac1   # bright magenta
bright6=9aedfe   # bright cyan
bright7=eff0eb   # bright white

